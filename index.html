<!doctype html>
<html lang="fr" data-theme="dracula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dracula</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <!--Structure-->
  <body class="flex items-center min-h-screen ">
    <div class="flex w-full flex-1 flex-col justify-center items-center gap-4">
      <h1 class="text-6xl text-neutral animate__animated animate__fadeInDown">Dracula</h1>

      <div
        class="grid flex-1 grid-cols-3 gap-4 justify-items-center items-center text-6xl text-neutral animate__animated animate__fadeInUp max-md:hidden "
      >
      <!--Icônes-->
        <div class="aspect-1/1 icon-x text-secondary text-primary animate__animated animate__rotateIn"></div>
        <div class="aspect-1/1 icon-circle-small text-primary"></div>
        <div class="aspect-1/1 icon-circle-small text-accent"></div>
        <div class="aspect-1/1 icon-x text-secondary animate__animated animate__rotateIn"></div>
        <div class="aspect-1/1 icon-circle-small text-accent"></div>
        <div class="aspect-1/1 icon-x text-secondary animate__animated animate__rotateIn"></div>
        <div class="aspect-1/1 icon-circle-small text-accent"></div>
        <div class="aspect-1/1 icon-x text-secondary animate__animated animate__rotateIn"></div>
        <div class="aspect-1/1 icon-circle-small text-primary"></div>
      </div>
    </div>
  </body>
</html>
